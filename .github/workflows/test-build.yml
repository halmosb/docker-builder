name: Test Docker Build (CI)

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.get_latest.outputs.python_version }}
      device_matrix: ${{ steps.set_matrix.outputs.device_matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml

      - name: Get latest Python version from config
        id: get_latest
        run: |
          VERSION=$(python3 -c "import yaml; cfg = yaml.safe_load(open('config/versions.yaml')); print(cfg['python_versions'][-1])")
          echo "python_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set device matrix
        id: set_matrix
        run: |
          if [[ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" == gpu-feature* ]]; then
            echo 'device_matrix=["cpu","gpu"]' >> $GITHUB_OUTPUT
          else
            echo 'device_matrix=["cpu"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        device-type: ${{ fromJson(needs.prepare.outputs.device_matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install generator deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Generate Dockerfiles
        run: docker-builder --no-root --no-latex

      - name: Save generated Dockerfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dockerfile.${{ needs.prepare.outputs.python_version }}.${{ matrix.device-type }}
          path: generated/Dockerfile.${{ needs.prepare.outputs.python_version }}.${{ matrix.device-type }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: generated/Dockerfile.${{ needs.prepare.outputs.python_version }}.${{ matrix.device-type }}
          push: false
          load: true
          tags: test-image:${{ matrix.device-type }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cache
          cache-to: type=inline

      - name: Print Trivy findings (debug)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image:${{ matrix.device-type }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image:${{ matrix.device-type }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ needs.prepare.outputs.python_version }}-${{ matrix.device-type }}
