name: Build and Deploy Docs

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - '.badges/**'
  pull_request:
    branches: [ master ]
  # Started by the release workflow on the new tag (tags it creates do not
  # trigger the push event above)
  workflow_dispatch:

# Serialize deployments; never cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/halmosb/docker-builder/python:3.14-cpu-v0.3.2
      options: --user 0
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark workspace as git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build HTML docs
        run: |
          sphinx-build -b html docs docs/_build/html
          sphinx-build -W -T -b html docs docs/_build/html

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-docs
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: html-docs
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
