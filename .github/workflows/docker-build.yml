name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get_versions.outputs.versions }}
      latest_version: ${{ steps.get_versions.outputs.latest_version }}
      owner_lc: ${{ steps.vars.outputs.owner_lc }}
      repo_lc: ${{ steps.vars.outputs.repo_lc }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "repo_lc=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml

      - name: Get Python versions from config
        id: get_versions
        run: |
          VERSIONS=$(python3 -c "import yaml,json;print(json.dumps(yaml.safe_load(open('config/versions.yaml'))['python_versions']))")
          LATEST=$(python3 -c "import yaml; cfg = yaml.safe_load(open('config/versions.yaml')); print(cfg['python_versions'][-1])")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT


  build:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJson(needs.prepare.outputs.versions) }}
        device-type: [cpu, gpu]

    permissions:
      contents: read
      packages: write

    env:
      OWNER: ${{ needs.prepare.outputs.owner_lc }}
      REPO: ${{ needs.prepare.outputs.repo_lc }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install generator deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Generate Dockerfiles
        run: docker-builder --no-root --no-latex

      - name: Save generated Dockerfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dockerfile.${{ matrix.python-version }}.${{ matrix.device-type }}
          path: generated/Dockerfile.${{ matrix.python-version }}.${{ matrix.device-type }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BUILD DIRECTLY INTO FINAL REPO (multi-tag = ONE manifest)
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: generated/Dockerfile.${{ matrix.python-version }}.${{ matrix.device-type }}
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/python:${{ matrix.python-version }}-${{ matrix.device-type }}-${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/python:${{ matrix.python-version }}-${{ matrix.device-type }}
            ${{ matrix.python-version == needs.prepare.outputs.latest_version && matrix.device-type == 'cpu' && format('{0}/{1}/{2}/python:latest', env.REGISTRY, env.OWNER, env.REPO) || '' }}

          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-buildcache:${{ matrix.device-type }}-${{ matrix.python-version }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}-buildcache:${{ matrix.device-type }}-${{ matrix.python-version }},mode=max

          provenance: false

  scan:
    needs: [build, prepare]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ${{ fromJson(needs.prepare.outputs.versions) }}
        device-type: [cpu, gpu]

    permissions:
      packages: read
      security-events: write

    env:
      OWNER: ${{ needs.prepare.outputs.owner_lc }}
      REPO: ${{ needs.prepare.outputs.repo_lc }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Trivy findings (debug)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/${{ env.REPO }}/python:${{ matrix.python-version }}-${{ matrix.device-type }}-${{ env.TAG }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/${{ env.REPO }}/python:${{ matrix.python-version }}-${{ matrix.device-type }}-${{ env.TAG }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.python-version }}-${{ matrix.device-type }}

  #  SINGLE WRITER JOB → avoids race + cleans the registry
  finalize:
    needs: [scan, prepare]
    runs-on: ubuntu-latest

    permissions:
      packages: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ needs.prepare.outputs.owner_lc }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      REPO: ${{ needs.prepare.outputs.repo_lc }}

    steps:
      # Pushing a release moves the floating tags (X.Y-cpu, X.Y-gpu, latest)
      # to the new images, so they never need to be deleted by hand. Rebuilding
      # an existing release tag leaves the previous images without any tag;
      # those untagged versions are deleted here. Tagged versions, including
      # the pinned X.Y-<device>-vA.B.C releases, are always kept.
      # NOTE: images are single-platform (provenance: false); a multi-platform
      # build would need its untagged child manifests kept.
      - name: Remove untagged image versions
        run: |
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            API="/orgs/${OWNER}/packages/container/${REPO}%2Fpython/versions"
          else
            API="/users/${OWNER}/packages/container/${REPO}%2Fpython/versions"
          fi

          IDS=$(gh api --paginate "$API" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')

          for id in $IDS; do
            echo "Deleting untagged version: $id"
            gh api --method DELETE "$API/$id"
          done
